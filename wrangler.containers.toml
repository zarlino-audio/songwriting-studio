# Zarlino Songwriting Studio — Container build (audio analysis runtime)
#
# Use this config when you want the analysis service running AS a Cloudflare
# Container instead of on a separate machine:
#
#     npm run deploy:containers      # == wrangler deploy --config wrangler.containers.toml
#
# REQUIREMENTS
#   1. Docker running locally (wrangler builds + pushes the image with Docker).
#   2. Workers Paid plan (Containers are a paid feature).
#
# Everything else is identical to wrangler.toml — keep the two files in sync
# when you add bindings. The only deltas are the AnalysisService container,
# its Durable Object binding/migration, and ANALYSIS_MODE = "container".

name = "zarlino-songwriting-studio"
# src/container-entry.ts re-exports everything from src/index.ts *and* the
# AnalysisService container class — wrangler requires the exported class here.
main = "src/container-entry.ts"
compatibility_date = "2026-09-01"
account_id = "ae604b602fdbcb1b48b41e975c6dbd19"

[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "songwriting-studio"
database_id = "0ec6c770-7b9d-4ecb-808a-f4e410e5d842"

[[kv_namespaces]]
binding = "KV"
id = "a7131623431446d1acf3ab4da4749b04"

[[r2_buckets]]
binding = "BEATS"
bucket_name = "songwriting-beats"

[[queues.producers]]
binding = "ANALYSIS_QUEUE"
queue = "songwriting-analysis"

[[queues.consumers]]
queue = "songwriting-analysis"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "songwriting-analysis-dlq"

[[durable_objects.bindings]]
name = "SONG_SESSION"
class_name = "SongSessionDO"

# The analysis runtime. `standard-1` = 1/2 vCPU, 4 GiB RAM, 8 GB disk — enough
# for numpy/scipy analysis of a full-length track with the image below.
#
# Two ways to supply the image:
#   (a) a Dockerfile path ("./analysis/Dockerfile")  -> wrangler builds it locally,
#       which requires a working Docker engine on the deploying machine;
#   (b) a pre-built registry reference (current)     -> no Docker needed at deploy
#       time. Publish it with `powershell -File ./tools/publish-image.ps1 -Tag 0.4.0`,
#       which assembles the image in Python and pushes it over HTTPS.
#
# `main` must stay src/container-entry.ts: it is the only entrypoint that exports
# the AnalysisService class wrangler looks for.
[[containers]]
class_name = "AnalysisService"
image = "registry.cloudflare.com/ae604b602fdbcb1b48b41e975c6dbd19/zarlino-songwriting-analysis:0.4.0"
# Keep this >= ANALYSIS_POOL_SIZE in src/integrations/analysis.ts: the Worker hashes
# each beat into a fixed pool of instance names, and asking for more distinct
# instances than max_instances lets running fails with "Maximum number of running
# container instances exceeded". The headroom above the pool size absorbs instances
# that are still shutting down (they linger for `sleepAfter` after their last request).
max_instances = 4
instance_type = "standard-1"
name = "zarlino-songwriting-analysis"

[[durable_objects.bindings]]
name = "ANALYSIS"
class_name = "AnalysisService"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SongSessionDO"]
[[migrations]]
tag = "v2"
new_sqlite_classes = ["AnalysisService"]

[vars]
ENVIRONMENT = "production"
CF_ACCOUNT_ID = "ae604b602fdbcb1b48b41e975c6dbd19"
R2_BUCKET = "songwriting-beats"
R2_S3_ENDPOINT = "https://ae604b602fdbcb1b48b41e975c6dbd19.r2.cloudflarestorage.com"

AI_GATEWAY_ENABLED = "true"
AI_GATEWAY_ID = "songwriting-studio"
AI_PROVIDER = "deepseek"
AI_MODEL_FAST = "deepseek-chat"
AI_MODEL_CREATIVE = "deepseek-chat"
AI_MODEL_REASONING = "deepseek-reasoner"

ANALYSIS_MODE = "container"
ANALYSIS_URL = ""
ANALYSIS_DISPATCH = "queue"

UPLOAD_MAX_BYTES = "524288000"
ALLOWED_ORIGINS = "https://zarlino-songwriting-studio.zarlino001.workers.dev"
